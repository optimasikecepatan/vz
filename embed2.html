<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Video JSON Player</title>
    <!-- Tailwind CSS untuk styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { margin: 0; background-color: #111827; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; font-family: 'Inter', sans-serif; }
        
        #player-container {
            position: relative;
            background: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            width: 100%;
            max-width: 1280px;
            aspect-ratio: 16 / 9; /* Default Landscape */
            transition: aspect-ratio 0.3s ease;
        }

        #slide-frame {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0; left: 0;
            background: white;
            pointer-events: none;
        }

        #controls-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 10;
        }

        #player-container:hover #controls-overlay,
        #controls-overlay.active {
            opacity: 1;
        }

        #start-overlay {
            position: absolute;
            inset: 0;
            background: rgba(17, 24, 39, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            backdrop-filter: blur(5px);
            overflow-y: auto;
            padding: 20px;
        }

        #start-overlay.hidden {
            display: none !important;
        }

        .btn-icon {
            background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer;
            transition: transform 0.2s, color 0.2s;
        }
        .btn-icon:hover { color: #3b82f6; transform: scale(1.1); }
        
        #progress-bar-container {
            position: absolute; bottom: 0; left: 0; right: 0; height: 4px; background: rgba(255,255,255,0.2); z-index: 11;
        }
        #progress-bar {
            height: 100%; width: 0%; background: #3b82f6; transition: width 0.1s linear;
        }
    </style>
</head>
<body>

<div id="player-container">
    <iframe id="slide-frame" sandbox="allow-scripts allow-same-origin"></iframe>

    <div id="start-overlay">
        <h1 class="text-2xl font-bold mb-3 flex items-center gap-2">
            <i class="fa-solid fa-play-circle text-blue-500 text-3xl"></i>
            SaaS Video JSON Player
        </h1>
        
        <div id="setup-panel" class="w-full max-w-lg bg-gray-800 p-6 rounded-lg shadow-lg border border-gray-700 text-left">
            <!-- Pilihan Tab Metode Input -->
            <div class="flex border-b border-gray-700 mb-4">
                <button id="tab-url" class="flex-1 pb-2 font-semibold text-blue-400 border-b-2 border-blue-500 text-center transition">URL / Link</button>
                <button id="tab-text" class="flex-1 pb-2 font-semibold text-gray-400 text-center transition">Paste Text JSON</button>
                <button id="tab-file" class="flex-1 pb-2 font-semibold text-gray-400 text-center transition">Upload File</button>
            </div>

            <!-- Panel Input URL -->
            <div id="panel-url" class="space-y-3">
                <label class="block text-xs text-gray-400">Masukkan URL JSON (ImageKit / Hosting Publik):</label>
                <input type="text" id="json-url-input" class="w-full p-3 rounded bg-gray-900 border border-gray-600 text-white text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="https://ik.imagekit.io/.../data.json">
            </div>

            <!-- Panel Input Text -->
            <div id="panel-text" class="space-y-3 hidden">
                <label class="block text-xs text-gray-400">Paste kode JSON lengkap di bawah ini:</label>
                <textarea id="json-text-input" rows="5" class="w-full p-3 rounded bg-gray-900 border border-gray-600 text-white text-xs font-mono focus:ring-2 focus:ring-blue-500 outline-none resize-none" placeholder='{"slidesData": [...]}'></textarea>
            </div>

            <!-- Panel Upload File -->
            <div id="panel-file" class="space-y-3 hidden">
                <label class="block text-xs text-gray-400">Pilih file .json dari perangkat Anda:</label>
                <input type="file" id="json-file-input" accept=".json" class="w-full p-2 rounded bg-gray-900 border border-gray-600 text-white text-sm file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer">
            </div>

            <!-- Pengaturan Rasio Video -->
            <div class="mt-4 pt-3 border-t border-gray-700 flex items-center justify-between">
                <span class="text-xs text-gray-400">Format Rasio Video:</span>
                <div class="flex gap-4 text-sm">
                    <label class="flex items-center gap-1.5 cursor-pointer">
                        <input type="radio" name="ratio" value="16/9" checked class="accent-blue-500"> Landscape (16:9)
                    </label>
                    <label class="flex items-center gap-1.5 cursor-pointer">
                        <input type="radio" name="ratio" value="9/16" class="accent-blue-500"> Portrait (9:16)
                    </label>
                </div>
            </div>

            <button id="btn-load" class="w-full mt-5 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded transition shadow-lg">
                Load & Play Video
            </button>
            <p id="error-msg" class="text-xs text-red-400 mt-2 text-center hidden"></p>
        </div>
        
        <!-- Big Play Button Overlay -->
        <div id="big-play-panel" class="hidden text-center mt-6">
            <button id="btn-big-play" class="text-6xl text-blue-500 hover:text-blue-400 hover:scale-110 transition drop-shadow-[0_0_15px_rgba(59,130,246,0.5)]">
                <i class="fa-solid fa-circle-play"></i>
            </button>
            <p class="mt-3 text-sm text-gray-300 font-medium">Data siap! Klik untuk mulai memutar video</p>
        </div>
    </div>

    <!-- Kontrol Pemutaran Bawah -->
    <div id="controls-overlay">
        <div class="flex items-center gap-4">
            <button id="btn-play-pause" class="btn-icon"><i class="fa-solid fa-pause"></i></button>
            <span id="slide-counter" class="text-sm font-semibold tracking-wider">1 / 1</span>
        </div>
        <div class="flex items-center gap-4">
            <button id="btn-prev" class="btn-icon text-sm"><i class="fa-solid fa-backward-step"></i></button>
            <button id="btn-next" class="btn-icon text-sm"><i class="fa-solid fa-forward-step"></i></button>
            <button id="btn-fullscreen" class="btn-icon text-sm ml-2"><i class="fa-solid fa-expand"></i></button>
        </div>
    </div>

    <div id="progress-bar-container">
        <div id="progress-bar"></div>
    </div>
</div>

<script>
    let presentationData = null;
    let slides = [];
    let assetMetadata = [];
    let currentSlideIndex = 0;
    
    let currentVoAudio = null;
    let currentSfxAudio = null;
    
    let isPlaying = false;
    let slideTimeout = null;
    let slideStartTime = 0;
    let timeRemaining = 0;
    let currentSlideTotalDuration = 0;
    let progressInterval = null;
    let isEmbedMode = false; // Flag to track if running in embed mode

    // UI Elements
    const elContainer = document.getElementById('player-container');
    const elFrame = document.getElementById('slide-frame');
    const elStartOverlay = document.getElementById('start-overlay');
    const elBigPlayPanel = document.getElementById('big-play-panel');
    const elSetupPanel = document.getElementById('setup-panel');
    const elBtnLoad = document.getElementById('btn-load');
    const elErrorMsg = document.getElementById('error-msg');
    const elBtnBigPlay = document.getElementById('btn-big-play');
    
    // Tab Elements
    const tabUrl = document.getElementById('tab-url');
    const tabText = document.getElementById('tab-text');
    const tabFile = document.getElementById('tab-file');
    const panelUrl = document.getElementById('panel-url');
    const panelText = document.getElementById('panel-text');
    const panelFile = document.getElementById('panel-file');
    let activeInputMode = 'url';

    // Kontrol Tab Switcher
    tabUrl.addEventListener('click', () => switchTab('url'));
    tabText.addEventListener('click', () => switchTab('text'));
    tabFile.addEventListener('click', () => switchTab('file'));

    function switchTab(mode) {
        activeInputMode = mode;
        [tabUrl, tabText, tabFile].forEach(t => {
            t.classList.remove('text-blue-400', 'border-b-2', 'border-blue-500');
            t.classList.add('text-gray-400');
        });
        [panelUrl, panelText, panelFile].forEach(p => p.classList.add('hidden'));

        if(mode === 'url') {
            tabUrl.classList.add('text-blue-400', 'border-b-2', 'border-blue-500');
            tabUrl.classList.remove('text-gray-400');
            panelUrl.classList.remove('hidden');
        } else if(mode === 'text') {
            tabText.classList.add('text-blue-400', 'border-b-2', 'border-blue-500');
            tabText.classList.remove('text-gray-400');
            panelText.classList.remove('hidden');
        } else if(mode === 'file') {
            tabFile.classList.add('text-blue-400', 'border-b-2', 'border-blue-500');
            tabFile.classList.remove('text-gray-400');
            panelFile.classList.remove('hidden');
        }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const jsonParam = urlParams.get('json');
    const ratioParam = urlParams.get('ratio');
    const embedParam = urlParams.get('embed');

    // Handle embed mode
    if (embedParam === '1') {
        isEmbedMode = true;
        // Optionally hide some UI elements in embed mode if needed, 
        // but for now, the start overlay is good enough.
    }

    if (ratioParam) {
        // Handle various ratio formats (e.g., "16/9", "16:9")
        const formattedRatio = ratioParam.replace(':', '/');
        elContainer.style.aspectRatio = formattedRatio;
        
        // Update radio buttons if they match
        const ratioRadio = document.querySelector(`input[name="ratio"][value="${formattedRatio}"]`);
        if (ratioRadio) {
            ratioRadio.checked = true;
        }
    }

    if (jsonParam) {
        document.getElementById('json-url-input').value = jsonParam;
        // Automatically attempt to load if in embed mode and URL is provided
        if (isEmbedMode) {
             elStartOverlay.innerHTML = '<div class="text-white text-xl animate-pulse">Loading presentation...</div>';
             loadDataFromUrl(jsonParam).then(() => {
                // Auto-start might be blocked by browsers, so we still show a play button
                showEmbedPlayButton();
             }).catch(err => {
                 elStartOverlay.innerHTML = `<div class="text-red-500 text-lg">Failed to load: ${err.message}</div>`;
             });
        } else {
             loadDataFromUrl(jsonParam);
        }
    }

    function showEmbedPlayButton() {
        elStartOverlay.style.display = 'flex';
        elStartOverlay.innerHTML = `
            <div id="embed-big-play-panel" class="text-center">
                <button id="btn-embed-play" class="text-6xl text-blue-500 hover:text-blue-400 hover:scale-110 transition drop-shadow-[0_0_15px_rgba(59,130,246,0.5)]">
                    <i class="fa-solid fa-circle-play"></i>
                </button>
                <p class="mt-3 text-sm text-gray-300 font-medium">Click to play</p>
            </div>
        `;
        document.getElementById('btn-embed-play').addEventListener('click', () => {
            elStartOverlay.style.display = 'none';
            currentSlideIndex = 0;
            playSlide(currentSlideIndex);
        });
    }

    elBtnLoad.addEventListener('click', async () => {
        elErrorMsg.classList.add('hidden');
        const ratio = document.querySelector('input[name="ratio"]:checked').value;
        elContainer.style.aspectRatio = ratio;

        try {
            if (activeInputMode === 'url') {
                const url = document.getElementById('json-url-input').value.trim();
                if (!url) throw new Error("URL JSON belum dimasukkan.");
                await loadDataFromUrl(url);
            } else if (activeInputMode === 'text') {
                const textContent = document.getElementById('json-text-input').value.trim();
                if (!textContent) throw new Error("Textarea JSON masih kosong.");
                const parsed = JSON.parse(textContent);
                parsePresentationData(parsed);
            } else if (activeInputMode === 'file') {
                const fileInput = document.getElementById('json-file-input');
                if (!fileInput.files.length) throw new Error("Belum ada file .json yang dipilih.");
                const fileText = await fileInput.files[0].text();
                const parsed = JSON.parse(fileText);
                parsePresentationData(parsed);
            }
        } catch (err) {
            elErrorMsg.innerText = `Error: ${err.message}`;
            elErrorMsg.classList.remove('hidden');
        }
    });

    async function loadDataFromUrl(url) {
        if (!isEmbedMode) elBtnLoad.innerText = "Mengunduh...";
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Gagal mengambil data (HTTP ${response.status})`);
        const data = await response.json();
        parsePresentationData(data);
    }

    function parsePresentationData(data) {
        presentationData = data;
        slides = presentationData.slidesData || [];
        assetMetadata = presentationData.uploadedAssetsMetadata || [];
        
        if (slides.length === 0) throw new Error("Data 'slidesData' kosong atau format JSON salah.");

        if (!isEmbedMode) {
            elSetupPanel.classList.add('hidden');
            elBigPlayPanel.classList.remove('hidden');
        }
    }

    function processHtmlAssets(html, metadata) {
        let processedHtml = html;
        
        if (metadata && metadata.length > 0) {
            metadata.forEach((asset, i) => {
                const baseId = `UPLOADED_ASSET_${i}`;
                const primaryUrl = asset.url || asset.videoUrl;
                if (primaryUrl) processedHtml = processedHtml.split(baseId).join(primaryUrl);
                
                if (asset.subFrames && Array.isArray(asset.subFrames)) {
                    asset.subFrames.forEach((frame, j) => {
                        const frameId = `${baseId}_FRAME_${j}`;
                        processedHtml = processedHtml.split(frameId).join(frame.url);
                    });
                }
            });
        }
        
        // INJEKSI GLOBAL CSS FIXES
        const cssFix = `
        <style>
            .absolute-full { position: absolute !important; inset: 0 !important; width: 100% !important; height: 100% !important; }
            .flex-center { display: flex !important; align-items: center !important; justify-content: center !important; }
            .text-shadow-glow { text-shadow: 0 0 10px currentColor; }
            body { margin: 0; overflow: hidden !important; width: 100vw; height: 100vh; }
        </style>
        `;
        
        if (processedHtml.includes('</head>')) {
            processedHtml = processedHtml.replace('</head>', cssFix + '</head>');
        } else {
            processedHtml = cssFix + processedHtml;
        }

        return processedHtml;
    }

    elBtnBigPlay.addEventListener('click', () => {
        elStartOverlay.style.display = 'none';
        currentSlideIndex = 0;
        playSlide(currentSlideIndex);
    });

    function stopCurrentSlide() {
        if (currentVoAudio) { currentVoAudio.pause(); currentVoAudio.currentTime = 0; }
        if (currentSfxAudio) { currentSfxAudio.pause(); currentSfxAudio.currentTime = 0; }
        clearTimeout(slideTimeout);
        clearInterval(progressInterval);
        isPlaying = false;
        document.getElementById('progress-bar').style.width = "0%";
    }

    function playSlide(index) {
        if (index < 0 || index >= slides.length) {
            finishPresentation();
            return;
        }

        stopCurrentSlide();
        currentSlideIndex = index;
        const slide = slides[index];
        document.getElementById('slide-counter').innerText = `${index + 1} / ${slides.length}`;
        isPlaying = true;
        updatePlayPauseIcon();

        const finalHtml = processHtmlAssets(slide.htmlCode, assetMetadata);
        
        const sfxMatch = finalHtml.match(/<audio\s+id="slideAudioSfx"\s+src=["']([^"']+)["']/i);
        const sfxUrl = sfxMatch ? sfxMatch[1] : null;

        const voUrl = slide.audioBlobUrl;
        const extraPause = (slide.extraPauseSeconds || 0) * 1000;
        let voDurationMs = 5000;

        const startPlayback = (duration) => {
            if (currentSlideIndex !== index || !isPlaying) return;
            
            elFrame.srcdoc = finalHtml;

            if (sfxUrl) {
                currentSfxAudio = new Audio(sfxUrl);
                currentSfxAudio.volume = 0.2;
                currentSfxAudio.loop = true;
                currentSfxAudio.play().catch(e => console.warn("BGM terhalang policy:", e));
            }
            if (currentVoAudio) {
                currentVoAudio.play().catch(e => console.warn("VO terhalang policy:", e));
            }
            
            scheduleNextSlide(duration, extraPause);
        };

        if (voUrl) {
            currentVoAudio = new Audio(voUrl);
            currentVoAudio.onloadedmetadata = () => {
                voDurationMs = (currentVoAudio.duration === Infinity ? 5 : currentVoAudio.duration) * 1000;
                startPlayback(voDurationMs);
            };
            currentVoAudio.onerror = () => startPlayback(voDurationMs);
        } else {
            startPlayback(voDurationMs);
        }
    }

    function scheduleNextSlide(voDurMs, extraPauseMs) {
        currentSlideTotalDuration = voDurMs + extraPauseMs;
        timeRemaining = currentSlideTotalDuration;
        slideStartTime = Date.now();
        
        resumeTimer();
        startProgressBar();
    }

    function resumeTimer() {
        slideTimeout = setTimeout(() => playSlide(currentSlideIndex + 1), timeRemaining);
    }

    function startProgressBar() {
        clearInterval(progressInterval);
        progressInterval = setInterval(() => {
            if (!isPlaying) return;
            const elapsed = Date.now() - slideStartTime;
            let currentProgMs = (currentSlideTotalDuration - timeRemaining) + elapsed;
            let percentage = (currentProgMs / currentSlideTotalDuration) * 100;
            if (percentage > 100) percentage = 100;
            document.getElementById('progress-bar').style.width = percentage + "%";
        }, 50);
    }

    const elBtnPlayPause = document.getElementById('btn-play-pause');
    elBtnPlayPause.addEventListener('click', () => {
        if (!presentationData) return;
        if (isPlaying) {
            isPlaying = false;
            clearTimeout(slideTimeout);
            clearInterval(progressInterval);
            timeRemaining -= (Date.now() - slideStartTime);
            if (currentVoAudio) currentVoAudio.pause();
            if (currentSfxAudio) currentSfxAudio.pause();
        } else {
            isPlaying = true;
            slideStartTime = Date.now();
            resumeTimer();
            startProgressBar();
            if (currentVoAudio) currentVoAudio.play();
            if (currentSfxAudio) currentSfxAudio.play();
        }
        updatePlayPauseIcon();
    });

    function updatePlayPauseIcon() {
        elBtnPlayPause.innerHTML = isPlaying ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play"></i>';
    }

    document.getElementById('btn-next').addEventListener('click', () => {
        if (currentSlideIndex < slides.length - 1) playSlide(currentSlideIndex + 1);
        else finishPresentation();
    });

    document.getElementById('btn-prev').addEventListener('click', () => {
        if (currentSlideIndex > 0) playSlide(currentSlideIndex - 1);
        else playSlide(0);
    });

    const elBtnFullscreen = document.getElementById('btn-fullscreen');
    elBtnFullscreen.addEventListener('click', () => {
        if (!document.fullscreenElement) elContainer.requestFullscreen().catch(err => {});
        else document.exitFullscreen();
    });

    document.addEventListener('fullscreenchange', () => {
        elBtnFullscreen.innerHTML = document.fullscreenElement ? '<i class="fa-solid fa-compress"></i>' : '<i class="fa-solid fa-expand"></i>';
    });

    function finishPresentation() {
        stopCurrentSlide();
        document.getElementById('progress-bar').style.width = "100%";
        elBtnPlayPause.innerHTML = '<i class="fa-solid fa-rotate-right"></i>';
        elBtnPlayPause.onclick = () => { location.reload(); };
    }
</script>
</body>
</html>
